# region Compose Configuration
name: documentation-chatbot-agentic

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: documentation-chatbot-agentic-pgvector
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-documentation_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - agentic_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documentation_chatbot"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Official DBeaver Web GUI (http://localhost:8979)
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: documentation-chatbot-agentic-cloudbeaver
    restart: unless-stopped
    ports:
      - "8979:8978"
    environment:
      CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED: "true"
      CLOUDBEAVER_APP_ANONYMOUS_USER_ROLE: "admin"
      CLOUDBEAVER_APP_DEFAULT_USER_TEAM: "admin"
      CLOUDBEAVER_APP_GRANT_CONNECTIONS_ACCESS_TO_ANONYMOUS_TEAM: "true"
      CLOUDBEAVER_APP_SUPPORTS_CUSTOM_CONNECTIONS: "true"
    volumes:
      - agentic_cloudbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      - pgvector

  # Local vLLM Service (High-throughput PagedAttention engine for merged HF weights)
  vllm:
    image: vllm/vllm-openai:latest
    container_name: documentation-chatbot-agentic-vllm
    restart: unless-stopped
    ports:
      - "8001:8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./qlora_slm/outputs/merged_model:/model:ro
    command: >
      /model
      --served-model-name ${LOCAL_SLM_MODEL:-kanzi-slm-extractor}
      --cpu-offload-gb 3
      --gpu-memory-utilization 0.70
      --max-model-len 512
      --enforce-eager
      --disable-access-log-for-endpoints /health
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 25
      start_period: 30s

  # Agentic RAG LangGraph API & Dev Server (http://localhost:2025)
  langgraph:
    build:
      context: .
      dockerfile: Dockerfile
    image: documentation-chatbot-agentic-langgraph:latest
    container_name: documentation-chatbot-agentic-langgraph
    restart: unless-stopped
    ports:
      - "2025:2024"
    command: ["langgraph", "dev", "--host", "0.0.0.0", "--port", "2024", "--no-browser", "--tunnel", "--server-log-level", "WARNING"]
    environment:
      PYTHONPATH: /app
      PGVECTOR_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword123}@pgvector:5432/${POSTGRES_DB:-documentation_chatbot}
      LOG_LEVEL: WARNING
      LOCAL_SLM_BASE_URL: ${CONTAINER_SLM_URL:-http://vllm:8000/v1}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-documentation-chatbot-agentic}
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./langgraph.json:/app/langgraph.json
      - ./dataset:/app/dataset:ro
    depends_on:
      pgvector:
        condition: service_healthy
      vllm:
        condition: service_started

volumes:
  agentic_pgvector_data:
  agentic_cloudbeaver_data:
# endregion
