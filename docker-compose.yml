# region Compose Configuration
name: documentation-chatbot

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: documentation-chatbot-pgvector
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-documentation_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documentation_chatbot"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Official DBeaver Web GUI (http://localhost:8978)
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: documentation-chatbot-cloudbeaver
    restart: unless-stopped
    ports:
      - "8978:8978"
    environment:
      CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED: "true"
      CLOUDBEAVER_APP_ANONYMOUS_USER_ROLE: "admin"
      CLOUDBEAVER_APP_DEFAULT_USER_TEAM: "admin"
      CLOUDBEAVER_APP_GRANT_CONNECTIONS_ACCESS_TO_ANONYMOUS_TEAM: "true"
      CLOUDBEAVER_APP_SUPPORTS_CUSTOM_CONNECTIONS: "true"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      - pgvector

  # Local Ollama LLM Service with Autonomous Model Bootstrapping
  ollama:
    image: ollama/ollama:latest
    container_name: documentation-chatbot-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &
        PID=$$!
        sleep 2
        ollama pull ${OLLAMA_MODEL:-qwen2.5:1.5b}
        wait $$PID
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q ${OLLAMA_MODEL:-qwen2.5:1.5b}"]
      interval: 5s
      timeout: 10s
      retries: 25
      start_period: 5s

  # LangGraph Agent API & Dev Server (http://localhost:2024)
  langgraph:
    build:
      context: .
      dockerfile: Dockerfile
    image: documentation-chatbot-langgraph:latest
    container_name: documentation-chatbot-langgraph
    restart: unless-stopped
    ports:
      - "2024:2024"
    environment:
      PYTHONPATH: /app
      PGVECTOR_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword123}@pgvector:5432/${POSTGRES_DB:-documentation_chatbot}
      LOG_LEVEL: WARNING
      OLLAMA_BASE_URL: http://ollama:11434/v1
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./langgraph.json:/app/langgraph.json
    depends_on:
      pgvector:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  pgvector_data:
  cloudbeaver_data:
  ollama_data:
# endregion
