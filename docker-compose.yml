# region Compose Configuration
name: documentation-chatbot

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: documentation-chatbot-pgvector
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-documentation_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documentation_chatbot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
# endregion
