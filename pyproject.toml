#region Build System Configuration
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
#endregion

#region Project Metadata & Runtime Dependencies
[project]
name = "documentation-chatbot"
version = "0.1.0"
description = "Modular, production-grade documentation chatbot and RAG backend engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.50",
    "flashrank>=0.2.0,<0.3.0",
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
    "langchain-openai>=0.2.0",
    "crawl4ai>=0.9.2",
    "python-dotenv>=1.0.0",
    "langgraph-cli[inmem]>=0.4.0",
    "langgraph-api>=0.11.0",
    "langchain-postgres>=0.0.12",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.3.0",
]
#endregion

#region Development & Testing Dependencies
[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "ruff>=0.3.0,<1.0.0",
    "ragas>=0.2.0",
    "rapidfuzz>=3.0.0",
    "pandas>=2.0.0",
    "datasets>=2.0.0",
    "ipykernel>=7.4.0",
]
#endregion

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501", "E402", "N999", "N802"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

