# region Docker Compose Local Documentation Chatbot Stack
name: documentation-chatbot

services:
  # PGVector Database
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: documentation-chatbot-pgvector
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=documentation_chatbot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword123
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - pgvector_data:/var/lib/postgresql/data

  # Unified Core RAG Backend & LangGraph Studio Dev Service
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: documentation-chatbot-backend:latest
    container_name: documentation-chatbot-backend
    user: "0:0"
    command: /app/entrypoint.sh
    ports:
      - "8000:8000"
      - "2024:2024"
    environment:
      - PYTHONPATH=/app
      - PGVECTOR_URL=postgresql+psycopg://postgres:postgrespassword123@pgvector:5432/documentation_chatbot
    env_file:
      - ../.env
    volumes:
      - ../src:/app/src
      - ../langgraph.json:/app/langgraph.json
    depends_on:
      - pgvector

volumes:
  pgvector_data:
# endregion
