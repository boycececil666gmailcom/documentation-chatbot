#region Docker Compose Local RAG Engine Stack
name: enterprise-rag-engine

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: enterprise-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.20.0
    container_name: enterprise-rag-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4jpassword123
    volumes:
      - neo4j_data:/data

  #region LangGraph Studio Dev Server Service
  langgraph-studio:
    build:
      context: ..
      dockerfile: Dockerfile
    image: enterprise-rag-langgraph-studio:latest
    container_name: enterprise-rag-langgraph-studio
    command: langgraph dev --host 0.0.0.0 --port 2024
    environment:
      - PYTHONPATH=/app/src
    ports:
      - "2024:2024"
    #endregion
    env_file:
      - ../.env
    volumes:
      - ..:/app
    depends_on:
      - qdrant
      - neo4j

  # Core RAG Backend Service
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: enterprise-rag-backend:latest
    container_name: enterprise-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      - qdrant
      - neo4j

volumes:
  qdrant_data:
  neo4j_data:
#endregion
