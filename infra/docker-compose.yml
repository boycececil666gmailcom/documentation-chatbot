#region Docker Compose Local Documentation Chatbot Stack
name: documentation-chatbot

services:
  # PGVector Database
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: documentation-chatbot-pgvector
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=documentation_chatbot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword123
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - pgvector_data:/var/lib/postgresql/data

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.20.0
    container_name: documentation-chatbot-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4jpassword123
    volumes:
      - neo4j_data:/data

  #region LangGraph Studio Dev Server Service
  langgraph-studio:
    build:
      context: ..
      dockerfile: Dockerfile
    image: documentation-chatbot-langgraph-studio:latest
    container_name: documentation-chatbot-langgraph-studio
    command: langgraph dev --host 0.0.0.0 --port 2024
    environment:
      - PYTHONPATH=/app
      - POSTGRES_HOST=pgvector
      - PGVECTOR_URL=postgresql+psycopg://postgres:postgrespassword123@pgvector:5432/documentation_chatbot
    ports:
      - "2024:2024"
    #endregion
    env_file:
      - ../.env
    volumes:
      - ..:/app
    depends_on:
      - pgvector
      - neo4j

  # Core RAG Backend Service
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: documentation-chatbot-backend:latest
    container_name: documentation-chatbot-backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=pgvector
      - PGVECTOR_URL=postgresql+psycopg://postgres:postgrespassword123@pgvector:5432/documentation_chatbot
    env_file:
      - ../.env
    depends_on:
      - pgvector
      - neo4j

volumes:
  pgvector_data:
  neo4j_data:
#endregion
